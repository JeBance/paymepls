<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>paymepls — минималистичный конструктор реквизитов</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --primary:#6c5ce7;
    --secondary:#00b894;
    --background:#f5f7fa;
    --text-main:#2d3436;
    --text-soft:#636e72;
    --border:#e0e0e0;
    --radius:18px;
    --shadow:0 8px 28px rgba(0,0,0,0.12);
    --shadow-hover:0 12px 40px rgba(0,0,0,0.16);
    --section-gap:clamp(40px,6vw,64px);
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:var(--background);
    font-family:"Inter",system-ui,sans-serif;
    color:var(--text-main);
    line-height:1.6;
    padding-bottom:120px;
}

h1,h2,h3{font-weight:700;color:var(--text-main);}
h1{font-size:clamp(2.2rem,4vw,3.2rem);margin-bottom:20px;}
h2{font-size:clamp(1.8rem,3vw,2.4rem);margin-bottom:16px;}
h3{font-size:clamp(1.3rem,2vw,1.7rem);margin-bottom:12px;}
p{font-size:clamp(1.05rem,1.4vw,1.2rem);color:var(--text-soft);}

.container{width:min(92%,1400px);margin:0 auto;padding-top:40px;}

header{
    width:100%;
    padding:10px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.9rem;
    font-weight:700;
    color:var(--primary);
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

.card{
    background:#fff;
    border-radius:var(--radius);
    padding:clamp(28px,4vw,40px);
    box-shadow:var(--shadow);
    transition:0.25s ease;
}
.card:hover{
    box-shadow:var(--shadow-hover);
    transform:translateY(-2px);
}

.btn{
    background:var(--primary);
    color:#fff;
    padding:clamp(14px,2vw,18px) clamp(24px,3vw,32px);
    border-radius:16px;
    font-size:clamp(1rem,1.2vw,1.15rem);
    font-weight:600;
    border:none;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:all 0.25s ease;
    display:inline-flex;
    align-items:center;
    gap:10px;
}
.btn:hover{
    filter:brightness(1.08);
    transform:translateY(-2px);
    box-shadow:var(--shadow-hover);
}
.btn-secondary{background:var(--secondary);}

.input{
    width:100%;
    padding:16px 20px;
    border-radius:14px;
    border:1px solid var(--border);
    font-size:1.1rem;
    outline:none;
    transition:0.2s;
}
.input:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(108,92,231,0.15);
}
textarea.input{resize:vertical;min-height:140px;}

.grid{display:grid;gap:32px;width:100%;}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(350px,1fr));}
.grid>*{min-width:0;}

@media(max-width:768px){
    .grid-2{grid-template-columns:1fr!important;}
}

.qr-box{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:20px;
    margin-bottom:12px;
}

#preview-container .card{margin-bottom:32px;}

@media(max-width:480px){
    .card{padding:24px;}
    .qr-box canvas{width:120px!important;height:120px!important;}
}
@media(min-width:1440px){
    body{font-size:1.15rem;}
    .qr-box canvas{width:200px!important;height:200px!important;}
}

/* ===========================
   ТЕМЫ
=========================== */

.theme-classic  {--primary:#6c5ce7;--secondary:#00b894;--background:#f5f7fa;}
.theme-ocean    {--primary:#0984e3;--secondary:#00cec9;--background:#e3f6ff;}
.theme-sunset   {--primary:#ff7675;--secondary:#fdcb6e;--background:#fff3e0;}
.theme-forest   {--primary:#2ecc71;--secondary:#27ae60;--background:#eafaf1;}
.theme-gray     {--primary:#2d3436;--secondary:#636e72;--background:#f2f2f2;}
.theme-gold     {--primary:#d4af37;--secondary:#b8860b;--background:#fff8e1;}
.theme-mint     {--primary:#00b894;--secondary:#55efc4;--background:#e8fff8;}
.theme-lavender {--primary:#a29bfe;--secondary:#81ecec;--background:#f3f0ff;}

.theme-dark {
    --primary:#6c5ce7;
    --secondary:#00b894;
    --background:#1e1e1e;
    --text-main:#fff;
    --text-soft:#ccc;
}

.theme-cyberpunk {
    --primary:#ff00ff;
    --secondary:#00ffff;
    --background:#0a0a0a;
    --text-main:#fff;
    --text-soft:#ccc;
}

.theme-dark .card,
.theme-cyberpunk .card {
    background:#111;
    color:#fff;
}

.theme-dark p,
.theme-cyberpunk p {
    color:#ccc;
}

.theme-dark .input,
.theme-cyberpunk .input {
    background:#222;
    color:#fff;
    border-color:#444;
}

.theme-dark .input::placeholder,
.theme-cyberpunk .input::placeholder {
    color:#888;
}

.theme-dark .btn,
.theme-cyberpunk .btn {
    box-shadow:none;
}
</style>
</head>

<body class="theme-classic">

<div class="container">

    <!-- HEADER -->
    <header>
        <div class="logo">
            <i class="fas fa-wallet"></i> paymepls
        </div>
    </header>

    <!-- КОНСТРУКТОР -->
    <section id="constructor" class="card" style="margin-top: var(--section-gap);">

        <!-- Заголовок как input -->
        <input id="title" class="input" style="font-size:1.6rem;font-weight:700;" value="Мои реквизиты">

        <!-- Описание -->
        <textarea id="description" class="input" style="margin-top:24px;">Выберите удобный способ для перевода</textarea>

        <!-- Тема -->
        <div style="margin-top:24px;">
            <label>Тема оформления</label>
            <select id="theme-select" class="input" style="margin-top:12px;">
                <option value="classic">Classic</option>
                <option value="ocean">Ocean</option>
                <option value="sunset">Sunset</option>
                <option value="forest">Forest</option>
                <option value="cyberpunk">Cyberpunk</option>
                <option value="gray">Gray</option>
                <option value="gold">Gold</option>
                <option value="mint">Mint</option>
                <option value="lavender">Lavender</option>
                <option value="dark">Dark</option>
            </select>
        </div>

        <!-- Кошельки -->
        <h2 style="margin-top:var(--section-gap);">Кошельки</h2>

        <div id="wallet-list" class="grid grid-2" style="margin-top: 28px;"></div>

        <button id="add-wallet-btn" class="btn" style="margin-top: 32px;">
            <i class="fas fa-plus"></i> Добавить кошелёк
        </button>

        <div style="margin-top: var(--section-gap);">
            <button id="generate-btn" class="btn btn-secondary">
                <i class="fas fa-link"></i> Создать ссылку
            </button>
        </div>

    </section>

    <!-- РЕЗУЛЬТАТ -->
    <section id="result" class="card" style="margin-top: var(--section-gap); display:none;">
        <h2>Готовая ссылка</h2>

        <input id="generated-url" class="input" readonly style="margin-top: 20px;">

        <div style="margin-top: 28px; display:flex; gap:20px; flex-wrap:wrap;">
            <button id="copy-btn" class="btn">
                <i class="fas fa-copy"></i> Скопировать
            </button>

            <button id="test-link-btn" class="btn btn-secondary">
                <i class="fas fa-external-link-alt"></i> Открыть
            </button>
        </div>
    </section>

    <!-- VIEW MODE -->
    <section id="view-mode" class="card" style="margin-top: var(--section-gap); display:none;">
        <div id="payment-page-container"></div>
    </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module" src="assets/js/app.js"></script>

</body>
</html>
