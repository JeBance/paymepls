<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>paymepls — минималистичный конструктор реквизитов</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">

<style>
    /* Честный индикатор загрузки */
    #shorten-btn[data-loading="true"] {
        opacity: 0.6;
        pointer-events: none;
    }

    /* Сообщение под ссылкой */
    #shorten-notice {
        margin-top: 8px;
        font-size: 0.9rem;
        color: var(--text-muted);
        opacity: 0.9;
    }
</style>

</head>

<body class="theme-classic">

<div class="container">

    <!-- HEADER -->
    <header>
      <div class="logo-block">
        <div class="logo">
          <i class="fas fa-wallet"></i> paymepls
        </div>
        <p class="tagline">Поделитесь реквизитами красиво</p>
      </div>
    </header>

    <!-- КОНСТРУКТОР -->
    <section id="constructor" class="card" style="margin-top: var(--section-gap);">

        <!-- Заголовок как input -->
        <input id="title" class="input" style="font-size:1.6rem;font-weight:700;" value="Мои реквизиты" placeholder="Заголовок">

        <!-- Описание -->
        <textarea id="description" class="input" style="margin-top:24px;" placeholder="Описание">Выберите удобный способ для перевода</textarea>

        <!-- Тема -->
        <div style="margin-top:24px;">
            <label>Тема оформления</label>
            <select id="theme-select" class="input" style="margin-top:12px;">
                <option value="classic">Classic</option>
                <option value="ocean">Ocean</option>
                <option value="sunset">Sunset</option>
                <option value="forest">Forest</option>
                <option value="cyberpunk">Cyberpunk</option>
                <option value="gray">Gray</option>
                <option value="gold">Gold</option>
                <option value="mint">Mint</option>
                <option value="lavender">Lavender</option>
                <option value="dark">Dark</option>
            </select>
        </div>

        <!-- Кошельки -->
        <h2 style="margin-top:var(--section-gap);">Кошельки</h2>

        <div id="wallet-list" class="grid grid-2" style="margin-top: 28px;">
            <div id="add-wallet-card" class="wallet-add-card">
                <i class="fas fa-plus"></i>
            </div>
        </div>

        <div style="margin-top: var(--section-gap);">
            <button id="generate-btn" class="btn btn-secondary">
                <i class="fas fa-link"></i> Создать ссылку
            </button>
        </div>

    </section>

    <!-- РЕЗУЛЬТАТ -->
    <section id="result" class="card" style="margin-top: var(--section-gap); display:none;">
      <h2>Готовая ссылка</h2>
    
      <div class="grid grid-2" style="margin-top: 28px; align-items: flex-start;">
    
        <!-- ✅ Левая колонка: ссылка + кнопки + лог -->
        <div>
          <input id="generated-url" class="input" readonly style="margin-top: 4px;">
          <p id="shorten-notice"></p>
    
          <div style="margin-top: 20px; display:flex; gap:12px; flex-wrap:wrap;">
            <button id="copy-btn" class="btn">
              <i class="fas fa-copy"></i> Скопировать
            </button>
            <button id="test-link-btn" class="btn btn-secondary">
              <i class="fas fa-external-link-alt"></i> Открыть
            </button>
            <button id="shorten-btn" class="btn btn-secondary" data-loading="false">
              <i class="fas fa-scissors"></i> Сократить
            </button>
          </div>
    
          <div id="shorten-log" class="log-card hidden" style="margin-top: 20px;">
            <div id="shorten-log-content"></div>
            <div id="shorten-log-hide">Скрыть</div>
          </div>
        </div>
    
        <!-- ✅ Правая колонка: QR-код -->
        <div id="qr-short-card" class="card hidden" style="text-align:center;">
          <h3>QR‑код</h3>
          <div id="qr-short" style="margin-top:12px;"></div>
        </div>
    
      </div>
    </section>

    <!-- VIEW MODE -->
    <section id="view-mode" class="card" style="margin-top: var(--section-gap); display:none;">
        <div id="payment-page-container"></div>
    </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module" src="assets/js/app.js"></script>

<div id="undo-toast" class="hidden">
    Кошелёк удалён — <span id="undo-btn">Отменить</span>
</div>

<footer class="footer">
    <a href="https://jebance.github.io/paymepls" target="_blank">paymepls</a>
    <span>© 2025</span>
    <a href="https://github.com/JeBance/paymepls" target="_blank">
        <i class="fab fa-github"></i> GitHub
    </a>
</footer>

</body>
</html>
